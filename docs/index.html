<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Wikipedia Glasses</title>
  <link rel="icon" type="image/png" href="/glasses/assets/favicon-CJavBxtt.png">
  <link rel="manifest" href="/glasses/assets/manifest-DnPyuYY6.webmanifest">
  <script type="module" crossorigin src="/glasses/assets/index-gBgusTen.js"></script>
  <link rel="stylesheet" crossorigin href="/glasses/assets/index-DtkiW268.css">
</head>
<body>
  <div id="app">
    <!-- Home Screen -->
    <div id="home" class="screen">
      <header class="header">
        <h1>Wikipedia Glasses</h1>
        <button class="badge badge-info focusable" id="saved-badge" data-action="go-to-saved">0 Saved</button>
      </header>
      <div class="content">
        <!-- Recent Saved Articles Grid -->
        <div id="recent-saved-container" class="hidden">
          <h2 class="section-title">Recent Saved</h2>
          <div class="data-grid" id="recent-saved-grid">
            <!-- Dynamic elements up to 9 (3 rows of 3 columns) -->
          </div>
        </div>



        <!-- Explore Grid -->
        <div class="featured-container">
          <h2 class="section-title">Explore</h2>
          <div class="data-grid">
            <button class="nav-item focusable" data-action="featured-search" data-term="Control theory">Control</button>
            <button class="nav-item focusable" data-action="featured-search" data-term="Queueing theory">Queues</button>
            <button class="nav-item focusable" data-action="featured-search" data-term="Reinforcement learning">RL</button>
            <button class="nav-item focusable" data-action="featured-search" data-term="Large language model">LLMs</button>
            <button class="nav-item focusable" data-action="featured-search" data-term="Mathematics">Math</button>
            <button class="nav-item focusable" data-action="featured-search" data-term="Computer science">CompSci</button>
          </div>
        </div>

        <!-- Random Summary Card -->
        <div class="card focusable" tabindex="0" data-action="fetch-random">
          <div class="card-title">Random Article</div>
        </div>
      </div>
    </div>

    <!-- Search Screen -->
    <div id="search" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <h1 id="search-title">Search Wiki</h1>
      </header>
      <div class="content">

        <div id="search-results" class="list-container">
          <!-- Search result list items generated dynamically -->
        </div>
      </div>
    </div>

    <!-- Article Detail Screen -->
    <div id="detail" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back" aria-label="Back">&#8592;</button>
        <button class="header-btn focusable" data-action="go-to-home" id="detail-home-btn" aria-label="Home">&#8962;</button>
        <button class="header-btn focusable" data-action="toggle-save" id="detail-save-btn" aria-label="Save Offline">&#9734;</button>
        <h1 id="detail-title">Article</h1>
      </header>
      <div class="content scroll-container focusable" id="detail-scroll-container" tabindex="0">
        <div id="detail-description">Description</div>
        <div id="detail-extract">Summary content goes here...</div>
      </div>
    </div>

    <!-- Saved Articles Screen -->
    <div id="saved" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <h1>Saved Pages</h1>
      </header>
      <div class="content">
        <div id="saved-list" class="list-container">
          <!-- Saved items generated dynamically -->
        </div>
      </div>
      <nav class="nav-bar">
        <button class="nav-item danger focusable" data-action="clear-all-saved">Clear All</button>
      </nav>
    </div>

    <!-- Global Loading Spinner Overlay -->
    <div id="loading" class="loading-container hidden">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loading-text">Fetching from Wikipedia...</div>
    </div>

    <!-- Global Error Dialog Overlay -->
    <div id="error" class="error-container hidden">
      <div class="error-icon">&#9888;</div>
      <div class="error-message" id="error-message">Something went wrong</div>
      <button class="nav-item focusable" data-action="clear-error">Dismiss</button>
    </div>


  </div>
</body>
</html>
